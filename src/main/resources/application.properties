# questo file di configurazione verrà incluso nel .war
# Configurazione dei datasource jndi principale
spring.datasource.jndi-name=jdbc/de4gsdzk
#
# Oracle ha bisogno che nella connessione sia specificato "includeSynonyms=true" in modo tale da poter ottenere le colonne dei sinonimi (serve per la validazione del db)
spring.datasource.connection-properties=includeSynonyms=true
#
# disabilito l'inizializzazione del db che fa spring (evita errori di bean non configurato e dipendenza ciclica)
spring.datasource.initialize=false
spring.datasource.initializeSize=0
spring.datasource.timeBetweenEvictionRunsMillis=5000
spring.datasource.minEvictableIdleTimeMillis=5000
spring.datasource.minIdle=0
#
# configurazione della connessione verso AD4
spring.datasources.ad4.jndi-name=jdbc/ad4
#
# configurazione della connessione verso GDM
spring.datasources.gdm.jndi-name=jdbc/gdm

# Hibernate deve essere configurato per fare flush "sempre" prima delle query
spring.jpa.properties.hibernate.flushMode=ALWAYS
spring.jpa.properties.hibernate.synonyms=true
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.properties.hibernate.current_session_context_class=it.finmatica.spring.utils.jpa.JpaSpringSessionContext
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=true
spring.jpa.properties.hibernate.hbm2ddl.auto=none

# validazione del db alla partenza del contesto
spring.jpa.hibernate.ddl-auto=validate

# configurazione per ad4
finmatica.ad4.chiaveRegistro=DE4GSDZK

# configurazione di base per spring-security
finmatica.ad4.modulo=DE4GSD
finmatica.ad4.istanza=GSD
finmatica.ad4.ruoliAccesso=AMM,RGSD

# configurazione per la basic-authentication dei webservice
#finmatica.ad4.basicAuth.urlPatterns=/services/**
#finmatica.ad4.basicAuth.authorities[0]=CAMBIAMIWS_AMM
#finmatica.ad4.basicAuth.authorities[1]=CAMBIAMIWS_UTE
#finmatica.ad4.basicAuth.authorities[2]=CAMBIAMI_AMM
#finmatica.ad4.basicAuth.authorities[3]=CAMBIAMI_UTE

finmatica.ad4.publicUrlPatterns=/css/**,/js/**,/images/**,/static/**,/webscan/upload/**,/richiestaANSC/**

# Configurazione per Reporter
finmatica.gestionetesti.reporter.openofficehost=localhost
finmatica.gestionetesti.reporter.openofficeport=8300
finmatica.gestionetesti.reporter.conversionEngine=ASPOSE.WORDS
finmatica.gestionetesti.reporter.mailMergeEngine=ASPOSE.WORDS

# configurazione del log in modo che scriva su un file con il nome del contesto (quando deployato su tomcat)
logging.file=${catalina.base:.}/logs/${finmatica.contextPath:de4gsdzk}.log
